# one-time reapply: document resolution
name: one-time-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Corrigir resolução de documentos
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'src/services/chat.service.ts',
            'src/services/search.service.ts'
          ];

          for (const p of files) {
            let s = fs.readFileSync(p, 'utf8');
            if (!s.includes('"penal"')) {
              const marker = '  "policiais",';
              if (!s.includes(marker)) throw new Error(`Marcador não encontrado em ${p}`);
              s = s.replace(marker, `${marker}\n  "penal",`);
            }
            fs.writeFileSync(p, s);
          }
          NODE
      - name: Validar build
        run: npm run build
      - name: Commit e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-fix.yml .github/workflows/inspect-chat.yml
          git add src/services/chat.service.ts src/services/search.service.ts .github/workflows/one-time-fix.yml .github/workflows/inspect-chat.yml
          git commit -m "fix: impedir resolução por palavra genérica penal"
          git push origin main
