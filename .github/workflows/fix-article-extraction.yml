name: fix-article-extraction
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Corrigir extractRequestedArticleText
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/services/chat.service.ts';
          let s = fs.readFileSync(p, 'utf8');
          const marker = 'export function isPartialArticleChunk';
          const markerIndex = s.indexOf(marker);
          if (markerIndex < 0) throw new Error('Ponto de inserção não encontrado');
          const fn = `/**
           * Extracts exactly the requested article from text containing multiple articles.
           * Returns a direct slice of the original string: no trim, normalization,
           * replacement, paraphrase, or LLM call is performed.
           */
          export function extractRequestedArticleText(text: string, articleNumber: number): string | null {
            if (typeof text !== 'string' || !Number.isInteger(articleNumber) || articleNumber < 0) return null;

            const headerRe = /(^|[\\r\\n \\t])((?:Artigo|Art\\.?|Art)[ \\t]+(\\d+)(?:º|°)?|(?:(\\d+)(?:º|°)))(?=[ \\t]*(?:[.:;]|$))/gim;
            const headers: Array<{ start: number; number: number }> = [];
            let match: RegExpExecArray | null;

            while ((match = headerRe.exec(text)) !== null) {
              const headerStart = match.index + match[1].length;
              const foundNumber = Number(match[3] ?? match[4]);
              if (Number.isInteger(foundNumber)) headers.push({ start: headerStart, number: foundNumber });
            }

            const requested = headers.find((h) => h.number === articleNumber);
            if (!requested) return null;

            const next = headers.find((h) => h.start > requested.start);
            return text.slice(requested.start, next ? next.start : text.length);
          }

          `;
          const existingStart = s.indexOf('export function extractRequestedArticleText');
          if (existingStart >= 0) {
            s = s.slice(0, existingStart) + fn + s.slice(markerIndex);
          } else {
            s = s.slice(0, markerIndex) + fn + s.slice(markerIndex);
          }
          fs.writeFileSync(p, s);
          NODE
      - name: Adicionar testes unitários
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/services/chat.service.test.ts';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace(
            /import \{ ChatService, isLiteralArticleRequest, isPartialArticleChunk(?:, extractRequestedArticleText)? \} from "\.\/chat\.service\.js";/,
            'import { ChatService, isLiteralArticleRequest, isPartialArticleChunk, extractRequestedArticleText } from "./chat.service.js";'
          );
          if (!s.includes('test("extractRequestedArticleText - preserves exact original slice"')) {
            s += `\n\ntest("extractRequestedArticleText - preserves exact original slice", () => {
  const text = "Artigo 22. Anterior.\\n\\nArt. 23.  Texto original.  \\n\\n\\tParágrafo único.\\nArt. 24. Próximo.";
  assert.strictEqual(extractRequestedArticleText(text, 23), "Art. 23.  Texto original.  \\n\\n\\tParágrafo único.\\n");
});

test("extractRequestedArticleText - accepts all supported header forms", () => {
  assert.strictEqual(extractRequestedArticleText("Artigo 23. Conteúdo. Artigo 24. Próximo.", 23), "Artigo 23. Conteúdo. ");
  assert.strictEqual(extractRequestedArticleText("Art. 23. Conteúdo. Art. 24. Próximo.", 23), "Art. 23. Conteúdo. ");
  assert.strictEqual(extractRequestedArticleText("Art 23. Conteúdo. Art 24. Próximo.", 23), "Art 23. Conteúdo. ");
  assert.strictEqual(extractRequestedArticleText("22º. Anterior. 23º. Conteúdo. 24º. Próximo.", 23), "23º. Conteúdo. ");
  assert.strictEqual(extractRequestedArticleText("22°. Anterior. 23°. Conteúdo. 24°. Próximo.", 23), "23°. Conteúdo. ");
});

test("extractRequestedArticleText - handles inline articles and final article", () => {
  const text = "22. Anterior. Art. 23. Conteúdo do artigo. Art. 24. Próximo.";
  assert.strictEqual(extractRequestedArticleText(text, 23), "Art. 23. Conteúdo do artigo. ");
  assert.strictEqual(extractRequestedArticleText(text, 24), "Art. 24. Próximo.");
  assert.strictEqual(extractRequestedArticleText(text, 99), null);
});
`;
            fs.writeFileSync(p, s);
          }
          NODE
      - name: Validar testes e build
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Commitar e encerrar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-article-extraction.yml
          git add src/services/chat.service.ts src/services/chat.service.test.ts .github/workflows/fix-article-extraction.yml
          git diff --cached --quiet || git commit -m "fix: isolar artigo literal em texto inline"
          git push origin main
